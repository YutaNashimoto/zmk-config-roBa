CONFIG_ZMK_KEYBOARD_NAME="roBa"

CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y

# 省電力: 30分(1800000ms)無操作でディープスリープ。
# キー押下で復帰（トラックボール操作では復帰しない）。トラックボール機の電池節約に有効。
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=1000
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
# snipe(低速CPI)機能は廃止しoverlayのzip_xy_scalerに統一（旧 CONFIG_PMW3610_SNIPE_CPI 系は削除）。
CONFIG_PMW3610_SCROLL_TICK=16
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_SCROLL_X=n
CONFIG_PMW3610_INVERT_SCROLL_Y=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
# 検証済み(2026-08): FORCE_AWAKE=y でカーソル暴走は改善しなかったため、
# 省電力RESTモードの移行・復帰は原因ではないと確定。電池の持ちを優先して n に戻す。
CONFIG_PMW3610_FORCE_AWAKE=n

# 検証済み(2026-08-18): 一度 n にして「250Hzのセンサー出力を2サンプル合算して
# 125Hzに間引く」処理を止めてみたが、カーソル暴走には効果が無かった。一方で
# 1レポートあたりの移動量が半分になり、体感速度が明らかに落ちる副作用が出たため
# y に戻した。呼び出しをまたいで last_x/last_y を保持する実装ではあるが、
# 暴走の原因ではないと判断する。
CONFIG_PMW3610_POLLING_RATE_125_SW=y
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=100000

CONFIG_PMW3610_MOVEMENT_THRESHOLD=0

CONFIG_PMW3610_SMART_ALGORITHM=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# USB接続時にホストOSを判定してデフォルトレイヤーを自動切替
# (Mac/iPad/iPhone=0 / Windows,Linux=11)
CONFIG_ZMK_OS_DETECTION=y

# BLEプロファイル番号を機器名に反映（roBa_1, roBa_2 ...）
CONFIG_ZMK_BLE_PROFILE_NAME=y

# 検証済み(2026-08-18): カーソル暴走の電気的要因を疑い CONFIG_BT_CTLR_TX_PWR_MINUS_8=y を
# 試したが、送信出力を下げると電波が弱くなって再送が増え、カーソル移動の遅延が体感で
# 明らかに悪化した(BLEの再送は次の接続間隔まで待つため)。実用に耐えないので既定へ戻した。
# なお暴走への効果は判定できていない(遅延が先に問題化したため)。
# 電気説を検証し直すなら、逆に送信出力を上げる(CONFIG_BT_CTLR_TX_PWR_PLUS_8=y)方が
# 筋が良い。電流バーストが増えるので、電気説が正しければ症状は悪化するはずで、
# しかも通信品質は上がるので遅延の副作用が出ない。
